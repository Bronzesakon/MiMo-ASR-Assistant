# 清单 I-01：CI 质量门禁（frontend / rust / security 三 job 并行 + 发布打包）
#
# 设计约束（按清单 I-01/I-02 原文）：
# - 权限最小化：顶层 permissions 只读；仅 package job 为发布 release 提升为
#   任务级 `contents: write`，其余三个 job 保持只读。
# - 依赖可重复：npm 一律 `npm ci` + 已提交 package-lock.json；
#   Cargo 一律 `--locked` + 已提交 Cargo.lock，禁止 CI 静默解析到不同依赖。
# - 缓存范围仅限 npm 下载缓存与 Cargo registry/git/target；
#   缓存 key 含锁文件 hash（setup-node cache 与 rust-cache 均自动满足）。
#   不缓存、不上传任何配置文件、API Key、用户音频、日志、临时转写文本。
# - CI 不运行需要真实 API Key 的在线转写；端到端真实服务冒烟保留为
#   发布前人工步骤（见 README「发布检查清单」）。
# - ffmpeg.exe 已入库（resources/ffmpeg.exe + .sha256），build.rs 的
#   SHA-256 门禁在 cargo check/test/clippy 编译期强制执行；rust job
#   另设显式哈希比对步骤，使门禁失败时日志更直观。
# - package job 承担「唯一出包口」：本地无需保留 target/ 等重产物。
#   发布策略参照 sevnX 的 CI：main 上每次构建都覆盖发布同一个 pre-release
#   （固定 tag `latest`，资产用 --clobber 覆盖、tag 强制移动、标题说明刷新），
#   推 tag 则发布该 tag 的正式 release；只产出 NSIS 安装包，同时上传 artifact 备用。

name: CI

on:
  push:
    branches: [main, master]
    # tag 触发正式 release：同时接受 `v1.2.0` 与历史沿用的裸版本号 `1.2.0`
    # （仓库既有 release 用的是 1.1.x 这种裸版本 tag）
    tags: ["v*", "[0-9]*"]
  pull_request:
  # C-04：手动触发的发布包门禁（构建 NSIS 安装包并校验产物）
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 增量产物会撑大缓存且在全新 runner 上无用（参照 sevnX CI）
  CARGO_INCREMENTAL: "0"

# 同一分支/PR 有新提交时取消旧运行，节省 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (typecheck / lint / vitest / build)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定受支持的 Node 主版本（与 README 前置依赖声明一致）
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm # 缓存 key 自动包含 package-lock.json hash

      - name: Install dependencies (npm ci, 锁文件一致)
        run: npm ci

      - name: Typecheck (vue-tsc --noEmit)
        run: npm run typecheck

      - name: Lint (ESLint, 0 warning 门禁)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: "Build (node scripts/build.mjs: typecheck + vite build)"
        run: npm run build

      - name: Version sync check (package.json / tauri.conf.json / Cargo.toml)
        run: npm run version:check

  rust:
    name: rust (check / test / clippy, Windows runner)
    runs-on: windows-latest
    # DPAPI 相关测试依赖 Windows，故 Rust job 固定在 Windows runner
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust 工具链由仓库根 rust-toolchain.toml 决定（channel + clippy），
      # GitHub runner 自带 rustup，自动按该文件安装；无需额外 action。
      - name: Cache Cargo (registry / git / target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # rust-cache 的缓存 key 自动包含 Cargo.lock hash

      # 显式验证捆绑 ffmpeg.exe 与 sha256 基准一致（build.rs 编译期门禁的
      # 等价前置检查；哈希不匹配时此处先给出直观错误）
      - name: Verify bundled ffmpeg.exe SHA-256 baseline
        shell: pwsh
        working-directory: .
        run: |
          $expected = (Select-String -Path src-tauri/resources/ffmpeg.exe.sha256 -Pattern '[0-9a-fA-F]{64}').Matches[0].Value.ToUpper()
          $actual = (Get-FileHash src-tauri/resources/ffmpeg.exe -Algorithm SHA256).Hash.ToUpper()
          if ($actual -ne $expected) {
            throw "ffmpeg.exe SHA-256 mismatch: expected $expected, actual $actual"
          }
          Write-Host "ffmpeg.exe integrity baseline OK: $actual"

      - name: cargo check --locked
        run: cargo check --locked

      - name: cargo test --locked
        run: cargo test --locked

      # --all-targets：lib/bin 与测试目标同等适用 0 warning 门禁
      # 本地等价命令：cargo clippy --locked --all-targets -- -D warnings
      - name: cargo clippy --locked --all-targets (0 warning 门禁)
        run: cargo clippy --locked --all-targets -- -D warnings

  # C-04：发布包门禁。workflow_dispatch / tag / main 推送触发；构建 NSIS 并校验产物，
  # 随后上传为可下载 artifact（本地产物因此可随时删除，需要出包时再取）。
  # 发布包：main 推送 / tag / 手动 dispatch 触发。构建 NSIS 并校验产物后，
  # 按 sevnX 的方式发布 release（main → 覆盖滚动 pre-release；tag → 正式 release）。
  # 只产出 NSIS 安装包本身，不再产出免安装 exe。
  package:
    name: package (tauri build / NSIS / release)
    runs-on: windows-latest
    # tag 一律触发（兼容历史裸版本号 `1.1.4` 与带前缀 `v1.1.4` 两种习惯）
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    # 顶层只读；仅本 job 需要写权限来创建/更新 release 与移动滚动 tag
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Rust 工具链由仓库根 rust-toolchain.toml 决定；GitHub runner 自带 rustup
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # NSIS 等打包工具链由 Tauri CLI 首次下载后复用（参照 sevnX CI）
      - name: Cache Tauri bundler toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/tauri.conf.json') }}
          restore-keys: ${{ runner.os }}-tauri-bundler-

      - name: Install dependencies (npm ci, 锁文件一致)
        run: npm ci

      - name: Lint (ESLint, 0 warning 门禁)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      # 发布门禁：MIMO_FFMPEG_REQUIRE=1 使 build.rs 在 ffmpeg.exe 缺失时硬失败
      - name: Tauri build (release, NSIS, ffmpeg required)
        env:
          MIMO_FFMPEG_REQUIRE: "1"
        run: npm run tauri build -- --bundles nsis

      # 静默安装到隔离目录，逐项核对安装包是否真的带上了编译期声明的静态资产。
      # 资产清单直接从 tauri.conf.json 的 bundle.resources 读取（不硬编码），
      # 以后往配置里新增资源文件也会被这里自动校验，不会漏检。
      - name: Verify installed package contains all declared static assets
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not produced" }
          Write-Host "NSIS: $($nsis.FullName)"
          # 隔离安装目录运行校验：不依赖 checkout 绝对路径
          $installDir = Join-Path $env:RUNNER_TEMP "mimo_install_check"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $proc = Start-Process -FilePath $nsis.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer silent run failed: $($proc.ExitCode)" }

          # 1) tauri.conf.json bundle.resources 声明的每个资源都必须在安装目录中就位
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $declared = @($conf.bundle.resources)
          if ($declared.Count -eq 0) { throw "bundle.resources is empty - check tauri.conf.json" }
          foreach ($res in $declared) {
            $rel = ($res -replace '/', '\')
            $target = Join-Path $installDir $rel
            if (-not (Test-Path $target)) { throw "declared resource missing in installed package: $res" }
            $size = (Get-Item $target).Length
            if ($size -le 0) { throw "declared resource is empty: $res" }
            Write-Host "resource OK: $res ($size bytes)"
          }

          # 2) 主程序本体在位且体积合理（前端 dist/ 由 tauri-codegen 编进该 exe，
          #    故它的存在与体积同时证明前端资源已被打包）
          $mainExes = @(Get-ChildItem -Path $installDir -Filter *.exe |
            Where-Object { $_.Name -ne 'uninstall.exe' })
          if ($mainExes.Count -eq 0) { throw "no application exe found in installed package" }
          $main = $mainExes | Sort-Object Length -Descending | Select-Object -First 1
          if ($main.Length -lt 1MB) { throw "application exe looks truncated: $($main.Name) $($main.Length) bytes" }
          Write-Host "application exe OK: $($main.Name) ($([math]::Round($main.Length/1MB,2)) MB)"

          # 3) 捆绑 ffmpeg 的哈希必须与仓库基准一致（防打包串包/损坏）
          $expected = (Select-String -Path src-tauri/resources/ffmpeg.exe.sha256 -Pattern '[0-9a-fA-F]{64}').Matches[0].Value.ToUpper()
          $installed = (Get-FileHash (Join-Path $installDir "resources\ffmpeg.exe") -Algorithm SHA256).Hash.ToUpper()
          if ($installed -ne $expected) { throw "installed ffmpeg.exe hash mismatch" }
          Write-Host "Package integrity OK, ffmpeg SHA-256 = $installed"

      # tag 触发时校验 tag 与 package.json 版本一致，避免产物名与版本错配。
      # 用 $env:GITHUB_REF_NAME 而不是 ${{ github.ref_name }}：免模板替换，
      # 脚本本体可被本地静态解析校验（该步骤只在 tag 推送时执行）。
      - name: Verify tag matches package version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($pkg -ne $tag) { throw "tag '$env:GITHUB_REF_NAME' does not match package.json version $pkg" }
          Write-Host "tag/version OK: $($env:GITHUB_REF_NAME) == $pkg"

      # 出包口：仅上传 NSIS 安装包（运行页面 Artifacts 区下载）
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mimo-asr-assistant-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: src-tauri/target/release/bundle/nsis/*.exe

      # 发布（参照 sevnX CI）：
      # - main 推送 → 覆盖发布固定 tag `latest` 的 pre-release：资产 --clobber 覆盖、
      #   tag 强制移动到本次 commit、标题/说明刷新，保证页面与二进制一致；
      # - tag 推送 → 发布该 tag 的正式 release（自动生成 release notes）。
      # 只发布安装包；免安装 exe 已不再产出，脚本会顺带清掉 release 上遗留的
      # 旧免安装资产（--clobber 只覆盖同名资产，不会自己消失）。
      # 资产名不能含空格：GitHub 会把空格重写成点，下载 URL 将不可预期，
      # 而 Tauri 按 productName 命名的安装包含空格，故在此重命名。
      - name: Publish release (rolling pre-release on main / release on tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "no NSIS installer was produced" >&2
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            title="MiMo ASR Assistant $tag"
            name="mimo-asr-assistant-${tag}-setup.exe"
            # 历史遗留的免安装 exe 命名（含带 tag 与不带 tag 两种）
            obsolete=("mimo-asr-assistant-${tag}.exe" "mimo-asr-assistant.exe")
            options=(--generate-notes)
            rolling=false
          else
            # 滚动 tag 刻意不带 v 前缀：否则会匹配本 workflow 的 `v*` 触发而再跑一次
            tag="latest"
            title="Latest build (main, $(date -u +%Y-%m-%d))"
            notes="Automatic build of main at ${GITHUB_SHA} (v${version})"
            name="mimo-asr-assistant-setup.exe"
            obsolete=("mimo-asr-assistant.exe")
            options=(--prerelease --notes "$notes")
            rolling=true
          fi

          staged="${RUNNER_TEMP}/${name}"
          cp "${installers[0]}" "$staged"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$staged" --clobber
            # 清掉不再产出的旧资产，使 release 上只留安装包
            for old in "${obsolete[@]}"; do
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$old"; then
                gh release delete-asset "$tag" "$old" --yes
                echo "removed obsolete asset: $old"
              fi
            done
            if [ "$rolling" = true ]; then
              # 只换资产的话，release 页面仍显示首次创建它的 commit 与服务旧标题/说明；
              # 故同时移动 tag 并刷新标题/说明，使页面与本次二进制一致。
              git push --force origin "HEAD:refs/tags/$tag"
              gh release edit "$tag" --title "$title" --notes "$notes"
            fi
          else
            gh release create "$tag" --title "$title" "${options[@]}" "$staged"
          fi
          gh release view "$tag" --json tagName,isPrerelease,assets \
            --jq '"published " + .tagName + " prerelease=" + (.isPrerelease|tostring) + " assets=" + ([.assets[].name]|join(","))'

  security:
    name: security (npm audit / cargo audit)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # 容忍策略（清单 I-02）：生产依赖 high/critical 阻断；
      # moderate/low 可暂缓但必须在 SECURITY.md 记录 advisory 与复查日期
      - name: npm audit (omit=dev, high 及以上阻断)
        run: npm audit --omit=dev --audit-level=high

      # RustSec 审计：cargo-audit 安装版本固定，避免供应链漂移。
      # 0.22.2 为下限：0.21.2 无法解析 advisory-db 的 CVSS 4.0 条目，
      # 会以 `unsupported CVSS version: 4.0` 恒失败（与漏洞无关）。
      #
      # 编译一次约 6-7 分钟，故缓存编好的二进制（key 含版本与 OS）。
      # 仍是本机从 crates.io 源码构建，不引入预编译二进制，供应链模型不变。
      - name: Cache cargo-audit binary (pinned 0.22.2)
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: cargo-audit-0.22.2-${{ runner.os }}

      # 缓存可能来自旧 runner 镜像或已损坏：执行前自检，不可用则重新编译兜底
      - name: Ensure cargo-audit is usable (rebuild if cache stale)
        shell: pwsh
        run: |
          $exe = Join-Path $env:USERPROFILE ".cargo\bin\cargo-audit.exe"
          $usable = $false
          if (Test-Path $exe) {
            try {
              $out = & $exe --version 2>&1
              if ($LASTEXITCODE -eq 0 -and "$out" -match '0\.22\.2') {
                Write-Host "cargo-audit restored from cache: $out"
                $usable = $true
              }
            } catch {
              Write-Host "cached cargo-audit not runnable: $_"
            }
          }
          if (-not $usable) {
            Write-Host "cargo-audit missing or unusable - compiling from crates.io source"
            Remove-Item $exe -Force -ErrorAction SilentlyContinue
            cargo install cargo-audit --version 0.22.2 --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo install cargo-audit failed" }
            $out = & $exe --version
            Write-Host "cargo-audit compiled: $out"
          }

      # 已登记例外见 src-tauri/.cargo/audit.toml 与 SECURITY.md；
      # 未登记的新 advisory 仍会以 --deny warnings 阻断
      - name: cargo audit --deny warnings
        working-directory: src-tauri
        run: cargo audit --deny warnings
